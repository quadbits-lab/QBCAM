[project]
name = "qb-media"
version = "0.1.0"
description = "QBCAM media sidecar — thumbnails, C2PA provenance, stills, batch"
requires-python = ">=3.12"
dependencies = [
  "qbcam-shm",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "Pillow>=10.4",
  "pydantic>=2.8",
]

[project.scripts]
qb-media = "qb_media.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qb_media"]

[tool.uv.sources]
qbcam-shm = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
